Avik is currently an Adjunct Associate Professor in the UPenn ESE department, and the Chief Science Officer at Ghost Robotics. In these roles, his goal is to produce research in robotics and AI that advances our conceptual understanding but can also be of immediate utility in the real world. He has received a Ph.D. and postdoc in the areas of bio-inspired design and control, and applied these methods to platforms ranging from a 100mg RoboBee to a 50kg rugged quadrupedal Vision 60. He is currently researching how modelling and dynamical systems methods can be integrated with reinforcement learning and AI world models to develop safe, reliable, and efficient robotic systems."><meta property="og:locale" content="en_us"><meta property="og:type" content="article"><meta property="article:section" content="balloon"><meta name=twitter:card content="summary"><meta name=twitter:title content="More About Me"><meta name=twitter:description content="Bio:
